<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="kf-title kf-desc">
    <title id="kf-title">How content becomes the site</title>
    <desc id="kf-desc">Content lives in the repository: person files, a BibTeX file and Markdown frontmatter. At build time VitePress data loaders read it, and the domain builders validate the frontmatter, failing the build with the page and key. The result is static HTML: member pages, team, publications, projects and the start page. A push to master deploys it to GitHub Pages at kohlbacherlab.org and publishes a Docker image to ghcr.io.</desc>
    <style>
        .kf-panel { fill: var(--panel); stroke: var(--border); }
        .kf-chip { fill: var(--chip); stroke: var(--border); }
        .kf-h { font: 600 15px Inter, system-ui, sans-serif; fill: var(--fg); }
        .kf-t { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--fg); }
        .kf-s { font: 12px Inter, system-ui, sans-serif; fill: var(--muted); }
        .kf-arrow { stroke: var(--muted); stroke-width: 2; fill: none; }
        .kf-head { fill: var(--muted); }
        .kf-sky { fill: var(--sky); }
        .kf-pink { fill: var(--pink); }
        .kf-green { fill: var(--green); }
        svg {
            --panel: #f4f6fb; --chip: #ffffff; --border: #d6dbe7; --fg: #111528; --muted: #5b6276;
            --sky: #0ea5e9; --pink: #e46f75; --green: #3fa258;
        }
        @media (prefers-color-scheme: dark) {
            svg {
                --panel: #111729; --chip: #070b18; --border: #2a3350; --fg: #e8ecf6; --muted: #aeb6cc;
                --sky: #7dd3fc; --pink: #f5a0a3; --green: #a8dcae;
            }
        }
    </style>
    <defs>
        <marker id="kf-arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="kf-head"/>
        </marker>
    </defs>

    <!-- Column 1: content -->
    <rect class="kf-panel" x="10" y="10" width="290" height="380" rx="14"/>
    <rect class="kf-sky" x="30" y="32" width="6" height="18" rx="2"/>
    <text class="kf-h" x="46" y="46">Content in src/</text>
    <g>
        <rect class="kf-chip" x="30" y="70" width="250" height="56" rx="8"/>
        <text class="kf-t" x="44" y="94">persons/*.mjs</text>
        <text class="kf-s" x="44" y="114">one file per team member</text>
        <rect class="kf-chip" x="30" y="138" width="250" height="56" rx="8"/>
        <text class="kf-t" x="44" y="162">publications/pub.bib</text>
        <text class="kf-s" x="44" y="182">BibTeX export of the papers</text>
        <rect class="kf-chip" x="30" y="206" width="250" height="56" rx="8"/>
        <text class="kf-t" x="44" y="230">projects/, software/</text>
        <text class="kf-s" x="44" y="250">frontmatter: funding, runtime, …</text>
        <rect class="kf-chip" x="30" y="274" width="250" height="56" rx="8"/>
        <text class="kf-t" x="44" y="298">research/, index.md</text>
        <text class="kf-s" x="44" y="318">areas, hero, lead, groups</text>
    </g>
    <text class="kf-s" x="30" y="366">Edited by hand, reviewed in a PR</text>

    <path class="kf-arrow" d="M304 200 H 336" marker-end="url(#kf-arrowhead)"/>

    <!-- Column 2: build -->
    <rect class="kf-panel" x="340" y="10" width="290" height="380" rx="14"/>
    <rect class="kf-pink" x="360" y="32" width="6" height="18" rx="2"/>
    <text class="kf-h" x="376" y="46">npm run build</text>
    <rect class="kf-chip" x="360" y="70" width="250" height="124" rx="8"/>
    <text class="kf-s" x="374" y="92">VitePress data loaders</text>
    <text class="kf-t" x="374" y="116">team.data.ts</text>
    <text class="kf-t" x="374" y="138">bib.data.ts</text>
    <text class="kf-t" x="374" y="160">projects.data.ts</text>
    <text class="kf-t" x="374" y="182">software, research …</text>
    <rect class="kf-chip" x="360" y="206" width="250" height="124" rx="8"/>
    <text class="kf-s" x="374" y="228">domains/ builders</text>
    <text class="kf-t" x="374" y="252">validate frontmatter</text>
    <text class="kf-s" x="374" y="276">a missing or wrong key fails</text>
    <text class="kf-s" x="374" y="294">the build and names the page</text>
    <text class="kf-s" x="374" y="312">and the key</text>
    <text class="kf-s" x="360" y="366">Runs at build time, not in the browser</text>

    <path class="kf-arrow" d="M634 200 H 666" marker-end="url(#kf-arrowhead)"/>

    <!-- Column 3: output -->
    <rect class="kf-panel" x="670" y="10" width="280" height="380" rx="14"/>
    <rect class="kf-green" x="690" y="32" width="6" height="18" rx="2"/>
    <text class="kf-h" x="706" y="46">Static site</text>
    <rect class="kf-chip" x="690" y="70" width="240" height="124" rx="8"/>
    <text class="kf-t" x="704" y="96">/persons/{slug}</text>
    <text class="kf-t" x="704" y="118">/team/</text>
    <text class="kf-t" x="704" y="140">/publications/</text>
    <text class="kf-t" x="704" y="162">/projects/, /software/</text>
    <text class="kf-t" x="704" y="184">/ (start page)</text>
    <rect class="kf-chip" x="690" y="206" width="240" height="124" rx="8"/>
    <text class="kf-s" x="704" y="228">push to master</text>
    <text class="kf-t" x="704" y="252">GitHub Pages</text>
    <text class="kf-s" x="704" y="272">kohlbacherlab.org</text>
    <text class="kf-t" x="704" y="298">Docker image</text>
    <text class="kf-s" x="704" y="318">ghcr.io/kohlbacherlab/homepage</text>
    <text class="kf-s" x="690" y="366">HTML served by Pages or nginx</text>
</svg>
