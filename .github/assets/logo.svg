<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" role="img">
    <title>KohlbacherLab</title>
    <rect x="0.25" y="0.25" width="31.5" height="31.5" rx="7" fill="#070b18" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.5"/>
    <rect x="3" y="19" width="4" height="8" rx="1" fill="#7dd3fc">
        <animate attributeName="height" from="0" to="8" dur="0.6s" begin="0s" fill="freeze" repeatCount="1"/>
        <animate attributeName="y" from="27" to="19" dur="0.6s" begin="0s" fill="freeze" repeatCount="1"/>
    </rect>
    <rect x="8.5" y="12" width="4" height="15" rx="1" fill="#a8dcae">
        <animate attributeName="height" from="0" to="15" dur="0.6s" begin="0.1s" fill="freeze" repeatCount="1"/>
        <animate attributeName="y" from="27" to="12" dur="0.6s" begin="0.1s" fill="freeze" repeatCount="1"/>
    </rect>
    <rect x="14" y="5" width="4" height="22" rx="1" fill="#f5a0a3">
        <animate attributeName="height" from="0" to="22" dur="0.6s" begin="0.2s" fill="freeze" repeatCount="1"/>
        <animate attributeName="y" from="27" to="5" dur="0.6s" begin="0.2s" fill="freeze" repeatCount="1"/>
    </rect>
    <rect x="19.5" y="10" width="4" height="17" rx="1" fill="#a8dcae">
        <animate attributeName="height" from="0" to="17" dur="0.6s" begin="0.3s" fill="freeze" repeatCount="1"/>
        <animate attributeName="y" from="27" to="10" dur="0.6s" begin="0.3s" fill="freeze" repeatCount="1"/>
    </rect>
    <rect x="25" y="16" width="4" height="11" rx="1" fill="#93c1e3">
        <animate attributeName="height" from="0" to="11" dur="0.6s" begin="0.4s" fill="freeze" repeatCount="1"/>
        <animate attributeName="y" from="27" to="16" dur="0.6s" begin="0.4s" fill="freeze" repeatCount="1"/>
    </rect>
</svg>
